    });
  }
  // key, z position, thickness (px), side colour, printed top?, pop offset
  const LAYERS = [
    ['A', 0, 22, '#ffffff', false, 0],
    ['B', 22, 10, '#3a2d29', true, 10],
    ['C', 32, 12, '#a87561', true, 26],
    ['D', 44, 10, '#3a2d29', true, 44],
    ['E', 32, 22, '#0a8be6', true, 52]
  ];
  const meshes = [];
  LAYERS.forEach(([k, z, depth, side, printed, pop]) => {
    const geo = new THREE.ExtrudeGeometry(shapes(DATA.layers[k]), {
      depth: depth, bevelEnabled: true, bevelThickness: 1.5, bevelSize: 1.2, bevelSegments: 2, curveSegments: 4, UVGenerator: UVG
    });
    const top = printed ? new THREE.MeshBasicMaterial({ map: texFor[k] }) : new THREE.MeshLambertMaterial({ color: '#ffffff' });
    const wall = printed ? new THREE.MeshLambertMaterial({ map: texFor[k], emissive: 0xffffff, emissiveMap: texFor[k], emissiveIntensity: k === 'D' ? 0 : 0.25 }) : new THREE.MeshLambertMaterial({ color: '#f2f2f2' });
    const m = new THREE.Mesh(geo, [top, wall]);
    m.position.z = z; m.userData = { z: z, pop: pop };
    inner.add(m); meshes.push(m);
  });
  // Logo on the back, raised slightly from the white layer
  (function () {
    const shapes = LOGO.shapes.map(sh => {
      const s = new THREE.Shape(sh.o.map(p => new THREE.Vector2(p[0] - LOGO.cx, -(p[1] - LOGO.cy))));
      sh.h.forEach(h => s.holes.push(new THREE.Path(h.map(p => new THREE.Vector2(p[0] - LOGO.cx, -(p[1] - LOGO.cy))))));
      return s;
    });
    const geo = new THREE.ExtrudeGeometry(shapes, { depth: 5, bevelEnabled: false });
    const k = 400 / LOGO.w;
    geo.scale(k, k, 1);
    geo.rotateY(Math.PI); // face backwards and read correctly from behind
    const logo = new THREE.Mesh(geo, new THREE.MeshLambertMaterial({ color: '#3a0a16' }));
    logo.position.set(395, -380, -1.4);
    inner.add(logo);
  })();
  // Centre the charm's thickness on the rotation axis
  inner.position.z = -38 * SC;

  // Soft ground shadow
  const sc = document.createElement('canvas'); sc.width = sc.height = 128;
  const sctx = sc.getContext('2d');
  const g = sctx.createRadialGradient(64, 64, 4, 64, 64, 64);
  g.addColorStop(0, 'rgba(30,40,60,.25)'); g.addColorStop(1, 'rgba(30,40,60,0)');
  sctx.fillStyle = g; sctx.fillRect(0, 0, 128, 128);
  const shadow = new THREE.Mesh(new THREE.PlaneGeometry(3.2, 1.2),
    new THREE.MeshBasicMaterial({ map: new THREE.CanvasTexture(sc), transparent: true, depthWrite: false }));
  shadow.rotation.x = -Math.PI / 2; shadow.position.y = -1.85; scene.add(shadow);

  const controls = new THREE.OrbitControls(camera, renderer.domElement);
  controls.enableDamping = true; controls.enablePan = false;
  controls.minDistance = 3; controls.maxDistance = 14; controls.autoRotateSpeed = 2.5;
  let baseDist = 7;
  function frontView() { camera.position.set(0, 0, baseDist); controls.target.set(0, 0, 0); controls.update(); }
  function resize() {
    const w = window.innerWidth, h = window.innerHeight;
    renderer.setSize(w, h); camera.aspect = w / h; camera.updateProjectionMatrix();
    const fit = 4.2; // scene units that should fit on screen
    const tanH = Math.tan(THREE.MathUtils.degToRad(15));
    baseDist = Math.max(fit / (2 * tanH), fit / (2 * tanH * camera.aspect));
  }
  resize(); frontView();
  window.addEventListener('resize', resize);

  const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  let lastTouch = -10;
  controls.addEventListener('start', () => { lastTouch = performance.now() / 1000; });

  const spinBtn = document.getElementById('spin');
  spinBtn.addEventListener('click', () => {
    controls.autoRotate = !controls.autoRotate;
    spinBtn.setAttribute('aria-pressed', String(controls.autoRotate));
  });
  document.getElementById('front').addEventListener('click', () => {
    controls.autoRotate = false; spinBtn.setAttribute('aria-pressed', 'false');
    charm.rotation.set(0, 0, 0); frontView();
  });
  let popped = false;
  const depthBtn = document.getElementById('depth');
  depthBtn.addEventListener('click', () => {
    popped = !popped; depthBtn.setAttribute('aria-pressed', String(popped));
    depthBtn.textContent = popped ? 'Flatten layers' : 'Pop layers';
  });

  const clock = new THREE.Clock();
  renderer.setAnimationLoop(() => {
    const t = clock.getElapsedTime();
    const idle = !controls.autoRotate && (performance.now() / 1000 - lastTouch) > 3 && !reduceMotion;
    const ty = idle ? Math.sin(t * 0.7) * 0.45 : charm.rotation.y;
    const tx = idle ? Math.sin(t * 0.5) * 0.12 : charm.rotation.x;
    charm.rotation.y += (ty - charm.rotation.y) * 0.05;
    charm.rotation.x += (tx - charm.rotation.x) * 0.05;
    if (!reduceMotion) charm.position.y = Math.sin(t * 1.2) * 0.03;
    meshes.forEach(m => {
      const target = m.userData.z + (popped ? m.userData.pop * 2.2 : 0);
      m.position.z += (target - m.position.z) * (reduceMotion ? 1 : 0.1);
    });
    controls.update();
    renderer.render(scene, camera);
  });
})();
</script>
</body>
</html>
