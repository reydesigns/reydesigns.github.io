  button { font: inherit; font-weight: 600; font-size: 1rem; color: var(--pill-ink); background: var(--pill);

(function () {

  const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
  stage.appendChild(renderer.domElement);
  const scene = new THREE.Scene();
  const camera = new THREE.PerspectiveCamera(30, 1, 0.1, 100);

  const fillL = new THREE.DirectionalLight(0xcfe4ff, 0.3); fillL.position.set(-3, -1, 2); scene.add(fillL);

  const loader = new THREE.TextureLoader();
  const texFor = {};
  Object.keys(TEX).forEach(k => {
    const tx = loader.load('data:image/png;base64,' + TEX[k]);
    tx.repeat.set(1 / DATA.w, 1 / DATA.h); tx.offset.set(0, 1);
    tx.anisotropy = renderer.capabilities.getMaxAnisotropy();
    texFor[k] = tx;

  const UVG = {
    generateTopUV: (g, v, a, b, c) => [a, b, c].map(i => new THREE.Vector2(v[i * 3], v[i * 3 + 1])),
    generateSideWallUV: (g, v, a, b, c, d) => [a, b, c, d].map(i => new THREE.Vector2(v[i * 3], v[i * 3 + 1]))
  };
  const charm = new THREE.Group();
  const inner = new THREE.Group();
  inner.scale.setScalar(SC);
  inner.position.set(-DATA.w / 2 * SC, DATA.h / 2 * SC, 0);
  charm.add(inner); scene.add(charm);

  function shapes(list) {
    return list.map(sh => {
      const s = new THREE.Shape(sh.o.map(p => new THREE.Vector2(p[0], -p[1])));
      sh.h.forEach(h => s.holes.push(new THREE.Path(h.map(p => new THREE.Vector2(p[0], -p[1])))));
      return s;
    });
  }
  // key, z position, thickness (px), side colour, printed top?, pop offset
  const LAYERS = [["A", 0, 22, "#ffffff", false, 0], ["B", 22, 10, "", true, 10], ["C", 32, 12, "", true, 26], ["D", 44, 10, "", true, 44], ["E", 32, 26, "", true, 60], ["F", 32, 20, "", true, 52]];
  const meshes = [];
  LAYERS.forEach(([k, z, depth, side, printed, pop]) => {
    const geo = new THREE.ExtrudeGeometry(shapes(DATA.layers[k]), {
      depth: depth, bevelEnabled: true, bevelThickness: 1.5, bevelSize: 1.2, bevelSegments: 2, curveSegments: 4, UVGenerator: UVG
    });
    const top = printed ? new THREE.MeshBasicMaterial({ map: texFor[k] }) : new THREE.MeshLambertMaterial({ color: '#ffffff' });
    const wall = printed ? new THREE.MeshLambertMaterial({ map: texFor[k], emissive: 0xffffff, emissiveMap: texFor[k], emissiveIntensity: (DATA.flatWalls || []).includes(k) ? 0 : 0.25 }) : new THREE.MeshLambertMaterial({ color: '#f2f2f2' });
