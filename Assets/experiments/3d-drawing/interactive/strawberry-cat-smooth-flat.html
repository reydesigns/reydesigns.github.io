<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Strawberry cat, smooth flat 3D</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg-top: #eaf3fb; --bg-bottom: #cfe1f1;
    --ink: #2f2522; --soft: #6c5d58;
    --pill: rgba(255,255,255,.75); --pill-ink: #2f2522; --accent: #0a8be6;
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg-top: #1c2533; --bg-bottom: #0f141d; --ink: #f2ebe7; --soft: #b6aaa5;
      --pill: rgba(40,48,62,.8); --pill-ink: #f2ebe7;
    }
  }
  :root[data-theme="dark"] {
    --bg-top: #1c2533; --bg-bottom: #0f141d; --ink: #f2ebe7; --soft: #b6aaa5;
    --pill: rgba(40,48,62,.8); --pill-ink: #f2ebe7;
  }
  *, *::before, *::after { box-sizing: inherit; }
  html { height: 100%; scroll-padding-top: env(safe-area-inset-top, 0px); }
  body {
    margin: 0; height: 100%; overflow: hidden;
    background: linear-gradient(180deg, var(--bg-top), var(--bg-bottom));
    color: var(--ink);
    font-family: "Fredoka", "Baloo 2", "Trebuchet MS", system-ui, sans-serif;
  }
  #stage { position: fixed; inset: 0; touch-action: none; }
  .caption { position: fixed; left: 20px; top: calc(16px + env(safe-area-inset-top, 0px)); max-width: 60ch; pointer-events: none; }
  .caption h1 { margin: 0; font-size: clamp(1.25rem, 3vw, 1.6rem); font-weight: 600; }
  .caption p { margin: .2rem 0 0; color: var(--soft); font-size: .95rem; }
  .controls { position: fixed; left: 0; right: 0; bottom: calc(20px + env(safe-area-inset-bottom, 0px));
    display: flex; justify-content: center; gap: 10px; flex-wrap: wrap; padding: 0 16px; }
  button { font: inherit; font-weight: 600; font-size: 1rem; color: var(--pill-ink); background: var(--pill);
    border: 2px solid transparent; border-radius: 999px; padding: .55rem 1.2rem; cursor: pointer; backdrop-filter: blur(6px); }
  button[aria-pressed="true"] { border-color: var(--accent); }
  button:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
</style>
</head>

<div id="stage" aria-label="Smooth flat 3D relief of the drawing. Drag to rotate, pinch or scroll to zoom."></div>
<div class="caption">
  <h1>Strawberry cat, smooth flat 3D</h1>
  <p>Each part gently puffed out, like a soft toy. Drag to tilt it.</p>
</div>
<div class="controls">
  <button id="front" type="button">Face front</button>

</div>

          if (x >= 0 && x < cw) tmp[y * cw + x] = s / c;
        }
      }
      for (let x = 0; x < cw; x++) {
        let s = 0, c = 0;
        for (let y = -R; y < ch + R; y++) {
          if (y + R < ch) { s += tmp[(y + R) * cw + x]; c++; }
          if (y - R - 1 >= 0) { s -= tmp[(y - R - 1) * cw + x]; c--; }
          if (y >= 0 && y < ch) a[y * cw + x] = s / c;
        }
      }
    }
    const bgeo = geo.clone();
    const bpos = bgeo.attributes.position;
    for (let i = 0; i < n; i++) bpos.setZ(i, -0.35 * Math.min(a[i], hz[i] * 2));
    bgeo.computeVertexNormals();
    const back = new THREE.Mesh(bgeo, new THREE.MeshStandardMaterial({
      map: backTex, alphaTest: 0.5, roughness: 0.7, side: THREE.DoubleSide
    }));
    charm.add(front, back);
  };
  img.src = HEIGHT;

  // Soft ground shadow
  const sc = document.createElement('canvas'); sc.width = sc.height = 128;
  const sctx = sc.getContext('2d');
  const g = sctx.createRadialGradient(64, 64, 4, 64, 64, 64);
  g.addColorStop(0, 'rgba(30,40,60,.25)'); g.addColorStop(1, 'rgba(30,40,60,0)');
  sctx.fillStyle = g; sctx.fillRect(0, 0, 128, 128);
  const shadow = new THREE.Mesh(new THREE.PlaneGeometry(3.2, 1.2),
    new THREE.MeshBasicMaterial({ map: new THREE.CanvasTexture(sc), transparent: true, depthWrite: false }));
  shadow.rotation.x = -Math.PI / 2; shadow.position.y = -1.85; scene.add(shadow);

  const controls = new THREE.OrbitControls(camera, renderer.domElement);
  controls.enableDamping = true; controls.enablePan = false;
  controls.minDistance = 3; controls.maxDistance = 14; controls.autoRotateSpeed = 2.5;
  let baseDist = 7;
  function frontView() { camera.position.set(0, 0, baseDist); controls.target.set(0, 0, 0); controls.update(); }
  function resize() {
    const w = window.innerWidth, h = window.innerHeight;
    renderer.setSize(w, h); camera.aspect = w / h; camera.updateProjectionMatrix();
    const fit = 4.2, tanH = Math.tan(THREE.MathUtils.degToRad(15));
    baseDist = Math.max(fit / (2 * tanH), fit / (2 * tanH * camera.aspect));
  }
  resize(); frontView();
  window.addEventListener('resize', resize);

  const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  let lastTouch = -10;
  controls.addEventListener('start', () => { lastTouch = performance.now() / 1000; });
  const spinBtn = document.getElementById('spin');
  spinBtn.addEventListener('click', () => {
    controls.autoRotate = !controls.autoRotate;
    spinBtn.setAttribute('aria-pressed', String(controls.autoRotate));
  });
  document.getElementById('front').addEventListener('click', () => {
    controls.autoRotate = false; spinBtn.setAttribute('aria-pressed', 'false');
    charm.rotation.set(0, 0, 0); frontView();
  });

  const clock = new THREE.Clock();
  renderer.setAnimationLoop(() => {
    const t = clock.getElapsedTime();
    const idle = !controls.autoRotate && (performance.now() / 1000 - lastTouch) > 3 && !reduceMotion;
    const ty = idle ? Math.sin(t * 0.7) * 0.45 : charm.rotation.y;
    const tx = idle ? Math.sin(t * 0.5) * 0.12 : charm.rotation.x;
    charm.rotation.y += (ty - charm.rotation.y) * 0.05;
    charm.rotation.x += (tx - charm.rotation.x) * 0.05;
    if (!reduceMotion) charm.position.y = Math.sin(t * 1.2) * 0.03;
    controls.update();
    renderer.render(scene, camera);
  });
})();
</script>
</body>
</html>
